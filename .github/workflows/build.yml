name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Check syntax of every script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Include *.ps1, *.psd1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            if ($_.Extension -eq '.psd1') {
              $null = [System.Management.Automation.Language.Parser]::ParseInput(
                (Get-Content -LiteralPath $_.FullName -Raw), $_.FullName, [ref]$tokens, [ref]$errors)
            }
            else {
              $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            }
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            }
          }
          if ($failed) { throw 'Syntax errors found.' }
          Write-Host 'Syntax OK.'

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 `
            -Severity Error, Warning
          $results | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($results) {
            $results | ForEach-Object {
              Write-Host "::error file=$($_.ScriptName),line=$($_.Line)::$($_.RuleName): $($_.Message)"
            }
            throw "$($results.Count) PSScriptAnalyzer finding(s)."
          }
          Write-Host 'PSScriptAnalyzer: no findings.'

      - name: Every language file has the same keys
        shell: pwsh
        run: |
          $reference = Import-PowerShellDataFile -LiteralPath ./lang/en.psd1
          $referenceKeys = $reference.Keys | Sort-Object
          $failed = $false
          Get-ChildItem ./lang -Filter *.psd1 | ForEach-Object {
            $data = Import-PowerShellDataFile -LiteralPath $_.FullName
            $missing = @($referenceKeys | Where-Object { -not $data.ContainsKey($_) })
            $extra = @($data.Keys | Where-Object { $referenceKeys -notcontains $_ })
            if ($missing.Count -or $extra.Count) {
              $failed = $true
              Write-Host "::error file=$($_.Name)::missing=[$($missing -join ',')] extra=[$($extra -join ',')]"
            }
          }
          if ($failed) { throw 'Language files are out of sync.' }
          Write-Host 'All language files are in sync.'

  installer:
    name: Build installer
    needs: lint
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            throw 'ISCC.exe not found after installation.'
          }

      - name: Compile
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' .\installer\FormatFAT32.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE." }

      - name: Upload setup
        uses: actions/upload-artifact@v7
        with:
          name: FormatFAT32-setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          generate_release_notes: true
